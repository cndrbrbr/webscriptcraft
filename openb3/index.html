<!-- ================================================================
     CLIENT-SIDE DRONE SIMULATOR + THREE.JS 3D PREVIEW
     ================================================================ -->
<script>

// ── Block colours (approximate Minecraft palette) ─────────────────
var BLOCK_COLORS = {
  AIR:          null,
  DIRT:         0x8B5E3C,
  GRASS_BLOCK:  0x5AA02C,
  STONE:        0x7F7F7F,
  COBBLESTONE:  0x6E6E6E,
  QUARTZ_BLOCK: 0xEFEDE3,
  SANDSTONE:    0xD3C57A,
  DIORITE:      0xBCBAB4,
  ANDESITE:     0x7E7E7E,
  GRANITE:      0xA76748,
  GLASS:        0xADD8FF,
  ICE:          0xA0C4FF,
  SNOW_BLOCK:   0xF0F0F8,
  GRAVEL:       0x9A9A9A,
  GLOWSTONE:    0xFFC060,
  BEACON:       0x00E5CC,
  OBSIDIAN:     0x1A0D2E,
  DIAMOND_BLOCK:0x4AEEE4,
  EMERALD_BLOCK:0x17DD62,
  IRON_BLOCK:   0xD8D8D8,
  GOLD_BLOCK:   0xFAD335,
  SAND:         0xDBC87A,
  BEDROCK:      0x444444,
  END_STONE:    0xD5CA8D,
  RED_WOOL:     0xA12722,
  ORANGE_WOOL:  0xF07613,
  YELLOW_WOOL:  0xF8C12F,
  LIME_WOOL:    0x5EA918,
  GREEN_WOOL:   0x364B18,
  BLUE_WOOL:    0x253192,
  PURPLE_WOOL:  0x641F9C,
  MAGENTA_WOOL: 0xBE49C9,
  PINK_WOOL:    0xD98199,
  WHITE_WOOL:   0xE9ECEC,
};

// ── Browser-side Drone simulator (mirrors Drones.js logic) ────────
function DronePreview() {
  this.x = 0; this.y = 0; this.z = 0;
  this.dir = 0; // 0=forward(-z), 1=right(+x), 2=back(+z), 3=left(-x)
  this.blocks = [];
}
DronePreview.prototype._add = function(mat, px, py, pz) {
  if (mat === 'AIR' || mat === 'air') return;
  this.blocks.push({ x: Math.floor(px), y: Math.floor(py), z: Math.floor(pz), material: mat });
};
DronePreview.prototype.box = function(mat, w, h, d) {
  w=Math.floor(w||1); h=Math.floor(h||1); d=Math.floor(d||1);
  for (var k=0; k<h; k++)
    for (var j=0; j<w; j++)
      for (var i=0; i<d; i++) {
        if      (this.dir===0) this._add(mat, this.x+j, this.y+k, this.z-i);
        else if (this.dir===1) this._add(mat, this.x+i, this.y+k, this.z+j);
        else if (this.dir===2) this._add(mat, this.x+j, this.y+k, this.z+i);
        else                   this._add(mat, this.x-i, this.y+k, this.z+j);
      }
};
DronePreview.prototype.box0 = function(mat, w, h, d) {
  w=Math.floor(w||1); h=Math.floor(h||1); d=Math.floor(d||1);
  for (var k=0; k<h; k++)
    for (var j=0; j<w; j++)
      for (var i=0; i<d; i++) {
        if ((i===0)||(i===d-1)||(j===0)||(j===w-1)) {
          if      (this.dir===0) this._add(mat, this.x+j, this.y+k, this.z-i);
          else if (this.dir===1) this._add(mat, this.x+i, this.y+k, this.z+j);
          else if (this.dir===2) this._add(mat, this.x+j, this.y+k, this.z+i);
          else                   this._add(mat, this.x-i, this.y+k, this.z+j);
        }
      }
};
DronePreview.prototype.fwd   = function(n) { n=Math.floor(n||1); if(this.dir===0)this.z-=n; else if(this.dir===1)this.x+=n; else if(this.dir===2)this.z+=n; else this.x-=n; };
DronePreview.prototype.back  = function(n) { n=Math.floor(n||1); if(this.dir===0)this.z+=n; else if(this.dir===1)this.x-=n; else if(this.dir===2)this.z-=n; else this.x+=n; };
DronePreview.prototype.up    = function(n) { this.y+=Math.floor(n||1); };
DronePreview.prototype.down  = function(n) { this.y-=Math.floor(n||1); };
DronePreview.prototype.right = function(n) { n=Math.floor(n||1); if(this.dir===0)this.x+=n; else if(this.dir===1)this.z+=n; else if(this.dir===2)this.x-=n; else this.z-=n; };
DronePreview.prototype.left  = function(n) { n=Math.floor(n||1); if(this.dir===0)this.x-=n; else if(this.dir===1)this.z-=n; else if(this.dir===2)this.x+=n; else this.z+=n; };
DronePreview.prototype.turn  = function(n) { this.dir=(this.dir+Math.floor(n||1))%4; };

// ── Three.js scene globals ─────────────────────────────────────────
var _scene, _camera, _renderer, _controls, _animId;

function _initThree() {
  var container = document.getElementById('x3ddiv');
  container.innerHTML = '';

  _scene = new THREE.Scene();
  _scene.background = new THREE.Color(0x87CEEB);

  var w = container.clientWidth, h = container.clientHeight;
  _camera = new THREE.PerspectiveCamera(45, w/h, 0.1, 2000);

  _renderer = new THREE.WebGLRenderer({ antialias: true });
  _renderer.setSize(w, h);
  container.appendChild(_renderer.domElement);

  _scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  var sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(20, 40, 20);
  _scene.add(sun);

  _controls = new THREE.OrbitControls(_camera, _renderer.domElement);
  _controls.enableDamping = true;
  _controls.dampingFactor = 0.08;

  // ground grid
  _scene.add(new THREE.GridHelper(100, 100, 0x888888, 0xcccccc));

  if (_animId) cancelAnimationFrame(_animId);
  (function loop() {
    _animId = requestAnimationFrame(loop);
    _controls.update();
    _renderer.render(_scene, _camera);
  })();
}

function _renderBlocks(blocks) {
  if (blocks.length === 0) {
    document.getElementById('errorbanner').style.display = 'block';
    document.getElementById('errorbanner').textContent = 'Keine Blöcke gebaut — prüfe, ob die Funktion aufgerufen wird.';
    return;
  }

  var boxGeo  = new THREE.BoxGeometry(0.96, 0.96, 0.96);
  var edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1));
  var edgeMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 });

  // deduplicate (overwrite duplicates — same as Minecraft behaviour)
  var seen = {};
  blocks.forEach(function(b) { seen[b.x+','+b.y+','+b.z] = b; });
  var deduped = Object.values(seen);

  var cx=0, cy=0, cz=0;
  deduped.forEach(function(b) {
    var col = BLOCK_COLORS[b.material];
    if (col === null || col === undefined) col = 0xCCCCCC;
    var mesh = new THREE.Mesh(boxGeo, new THREE.MeshLambertMaterial({ color: col }));
    mesh.position.set(b.x + 0.5, b.y + 0.5, b.z + 0.5);
    _scene.add(mesh);
    var edges = new THREE.LineSegments(edgeGeo, edgeMat);
    edges.position.copy(mesh.position);
    _scene.add(edges);
    cx+=b.x; cy+=b.y; cz+=b.z;
  });

  // focus camera on centre of structure
  var n = deduped.length;
  cx/=n; cy/=n; cz/=n;
  var spread = Math.max(10, Math.sqrt(n) * 2);
  _controls.target.set(cx, cy, cz);
  _camera.position.set(cx + spread, cy + spread, cz + spread * 1.5);
  _controls.update();
}

// ── Main preview entry point ───────────────────────────────────────
function preview() {
  document.getElementById('errorbanner').style.display = 'none';

  var code = Blockly.JavaScript.workspaceToCode(demoWorkspace);

  // The generated code already ends with funcname(); from the "preview function" block.
  // Just run it directly with the drone simulator in scope.
  var drone = new DronePreview();

  try {
    new Function('drone', code)(drone);
  } catch (e) {
    document.getElementById('errorbanner').style.display = 'block';
    document.getElementById('errorbanner').textContent = 'Fehler: ' + e.message;
    console.error(e);
    return;
  }

  _initThree();
  _renderBlocks(drone.blocks);
}

// ── Generate JS for JSMN — download ───────────────────────────────
function showCode() {
  var raw = Blockly.JavaScript.workspaceToCode(demoWorkspace);
  // Use the called function name (funcname();) as filename, fallback to 'jsmn_script'
  var callMatch = raw.match(/^(\w+)\(\);\s*$/m);
  var filename  = (callMatch ? callMatch[1] : 'jsmn_script') + '.js';
  var code = _prettyPrintJs(raw) + '\nplayer.sendMessage("Done!");\n';
  _download(code, filename, 'text/plain');
}

// ── Blocks / JavaScript view toggle ────────────────────────────────
// Blocks are the source of truth by default: switching to the JS view
// always regenerates the textarea from the current workspace. Editing
// the JS is only committed back to blocks explicitly, via Apply.
var _lastGeneratedJs = '';

// Indents nested lines and spaces out commas for readability. Only ever
// adds whitespace -- never reorders, merges, or splits lines -- so the
// JS -> Blocks parser (which trims each line and already tolerates
// flexible whitespace around commas) keeps parsing it identically.
function _prettyPrintJs(code) {
  var lines = code.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l.length > 0; });
  var indent = 0;
  var out = [];
  lines.forEach(function(line) {
    if (/^\};?$/.test(line)) indent = Math.max(0, indent - 1);
    var spaced = line.replace(/,(?!\s)/g, ', ');
    out.push('  '.repeat(indent) + spaced);
    if (/\{\s*$/.test(line)) indent++;
  });
  return out.join('\n');
}

function refreshJsView() {
  var code = _prettyPrintJs(Blockly.JavaScript.workspaceToCode(demoWorkspace));
  _lastGeneratedJs = code;
  document.getElementById('jsCodeArea').value = code;
}

function showJsView() {
  refreshJsView();
  document.getElementById('blocklyDiv').style.display = 'none';
  document.getElementById('jsViewDiv').style.display = 'block';
}

function showBlocksView() {
  var current = document.getElementById('jsCodeArea').value;
  if (document.getElementById('jsViewDiv').style.display !== 'none' && current !== _lastGeneratedJs) {
    var ok = confirm('Ungespeicherte Änderungen im JavaScript-Code gehen verloren, wenn du nicht zuerst auf ' +
                      '"In Blöcke übernehmen" klickst. Trotzdem zu den Blöcken wechseln?');
    if (!ok) return;
  }
  document.getElementById('jsViewDiv').style.display = 'none';
  document.getElementById('blocklyDiv').style.display = 'block';
}

// ── JavaScript → Blocks: best-effort parser for the JSMN vocabulary ─
// Understands exactly the patterns the JSMN block generators emit
// (function wrapper, drone.box/box0/movement calls, function calls).
// Anything outside that vocabulary — loops, variables, arithmetic,
// arbitrary JS — is rejected with the offending line number rather
// than silently dropped or guessed at. This is deliberate: a general
// JS-to-Blockly parser isn't realistic, but JSMN's own limited output
// grammar is small enough to round-trip reliably.
function _escXml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function _blocksToXml(blocks) {
  var opens = blocks.map(function(b) {
    if (b.type === 'funcbegin') {
      return '<block type="funcbegin"><field name="funcname">' + _escXml(b.funcname) + '</field>';
    }
    if (b.type === 'funcend') {
      return '<block type="funcend">';
    }
    if (b.type === 'boxcmd') {
      return '<block type="boxcmd">'
           + '<field name="NAME">' + _escXml(b.mat) + '</field>'
           + '<field name="width">' + b.width + '</field>'
           + '<field name="height">' + b.height + '</field>'
           + '<field name="depth">' + b.depth + '</field>';
    }
    if (b.type === 'box0') {
      return '<block type="box0">'
           + '<field name="Boxtype">' + _escXml(b.boxtype) + '</field>'
           + '<field name="NAME">' + _escXml(b.mat) + '</field>'
           + '<value name="X"><block type="math_number"><field name="NUM">' + b.w + '</field></block></value>'
           + '<value name="Z"><block type="math_number"><field name="NUM">' + b.h + '</field></block></value>'
           + '<value name="Y"><block type="math_number"><field name="NUM">' + b.d + '</field></block></value>';
    }
    if (b.type === 'move') {
      return '<block type="move">'
           + '<field name="wayto">' + _escXml(b.dir) + '</field>'
           + '<field name="amount">' + b.amount + '</field>';
    }
    if (b.type === 'exports') {
      return '<block type="exports"><field name="exportname">' + _escXml(b.funcname) + '</field>';
    }
    if (b.type === 'functioncall') {
      return '<block type="functioncall"><field name="funcname">' + _escXml(b.funcname) + '</field>';
    }
  });

  var xml = '';
  for (var i = 0; i < opens.length; i++) {
    xml += opens[i];
    if (i < opens.length - 1) xml += '<next>';
  }
  for (var j = 0; j < opens.length; j++) {
    xml += '</block>';
    if (j < opens.length - 1) xml += '</next>';
  }
  return '<xml xmlns="https://developers.google.com/blockly/xml">' + xml + '</xml>';
}

function _parseJsToBlocks(code) {
  var lines = code.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l.length > 0; });
  var blocks = [];
  var insideFunction = false;

  var RE_FUNCBEGIN = /^function\s+(\w+)\s*\(\)\s*\{$/;
  var RE_FUNCEND   = /^\};?$/;
  var RE_BOXCMD    = /^drone\.box\(\s*"([^"]*)"\s*,\s*(-?\d+)\s*,\s*(-?\d+)\s*,\s*(-?\d+)\s*\)\s*;$/;
  var RE_BOX0      = /^drone\.(box0|box)\(\s*"([^"]*)"\s*,\s*Math\.floor\(\s*(-?\d+(?:\.\d+)?)\s*\)\s*,\s*Math\.floor\(\s*(-?\d+(?:\.\d+)?)\s*\)\s*,\s*Math\.floor\(\s*(-?\d+(?:\.\d+)?)\s*\)\s*\)\s*;$/;
  var RE_MOVE      = /^drone\.(up|down|fwd|back|left|right|turn)\(\s*(-?\d+)\s*\)\s*;$/;
  var RE_MOVE_FLR  = /^drone\.(up|down|fwd|back|left|right|turn)\(\s*Math\.floor\(\s*(-?\d+(?:\.\d+)?)\s*\)\s*\)\s*;$/;
  var RE_CALL      = /^(\w+)\(\)\s*;$/;

  for (var idx = 0; idx < lines.length; idx++) {
    var line = lines[idx], m;
    if ((m = line.match(RE_FUNCBEGIN))) {
      blocks.push({ type: 'funcbegin', funcname: m[1] });
      insideFunction = true;
    } else if (RE_FUNCEND.test(line)) {
      blocks.push({ type: 'funcend' });
      insideFunction = false;
    } else if ((m = line.match(RE_BOXCMD))) {
      blocks.push({ type: 'boxcmd', mat: m[1], width: m[2], height: m[3], depth: m[4] });
    } else if ((m = line.match(RE_BOX0))) {
      blocks.push({
        type: 'box0', boxtype: m[1], mat: m[2],
        w: Math.floor(parseFloat(m[3])), h: Math.floor(parseFloat(m[4])), d: Math.floor(parseFloat(m[5]))
      });
    } else if ((m = line.match(RE_MOVE))) {
      blocks.push({ type: 'move', dir: m[1], amount: m[2] });
    } else if ((m = line.match(RE_MOVE_FLR))) {
      blocks.push({ type: 'move', dir: m[1], amount: String(Math.floor(parseFloat(m[2]))) });
    } else if ((m = line.match(RE_CALL))) {
      blocks.push({ type: insideFunction ? 'functioncall' : 'exports', funcname: m[1] });
    } else {
      throw new Error('Zeile ' + (idx + 1) + ' nicht erkannt: "' + line + '"');
    }
  }

  if (blocks.length === 0) throw new Error('Kein Code zum Übernehmen gefunden.');
  return blocks;
}

function applyJsToBlocks() {
  document.getElementById('errorbanner').style.display = 'none';
  var code = document.getElementById('jsCodeArea').value;
  try {
    var blocks = _parseJsToBlocks(code);
    var xmlString = _blocksToXml(blocks);
    var dom = new DOMParser().parseFromString(xmlString, 'text/xml');
    demoWorkspace.clear();
    Blockly.Xml.domToWorkspace(dom.documentElement, demoWorkspace);
    document.getElementById('jsViewDiv').style.display = 'none';
    document.getElementById('blocklyDiv').style.display = 'block';
  } catch (e) {
    document.getElementById('errorbanner').style.display = 'block';
    document.getElementById('errorbanner').textContent = 'Konnte JavaScript nicht in Blöcke übersetzen: ' + e.message;
    console.error(e);
  }
}

// ── Save workspace as JSON (Blockly v12 native format) ────────────
function saveXmlLocal() {
  var state    = Blockly.serialization.workspaces.save(demoWorkspace);
  var jsonText = JSON.stringify(state, null, 2);
  // Derive filename from first funcbegin block name, fallback to 'jsmn_blocks'
  var code      = Blockly.JavaScript.workspaceToCode(demoWorkspace);
  var nameMatch = code.match(/^function\s+(\w+)/m);
  var filename  = (nameMatch ? nameMatch[1] : 'jsmn_blocks') + '.json';
  _download(jsonText, filename, 'application/json');
}

function _download(text, filename, mime) {
  var blob = new Blob([text], { type: mime + ';charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Load workspace from local file(s) — JSON or legacy XML ────────
function onFileLoad(input, additive) {
  var files = Array.from(input.files);
  input.value = '';   // reset so same file can be re-picked
  if (files.length === 0) return;

  var clearedOnce = false;
  files.forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        if (!additive && !clearedOnce) { demoWorkspace.clear(); clearedOnce = true; }

        if (file.name.endsWith('.json')) {
          // Blockly v12 JSON serialization
          var incoming = JSON.parse(e.target.result);
          if (additive) {
            // Merge: serialization.load always wipes, so we combine block lists manually
            var current = Blockly.serialization.workspaces.save(demoWorkspace);
            var curBlocks = (current.blocks && current.blocks.blocks) ? current.blocks.blocks : [];
            var newBlocks = (incoming.blocks && incoming.blocks.blocks) ? incoming.blocks.blocks : [];
            incoming.blocks = incoming.blocks || { languageVersion: 0, blocks: [] };
            incoming.blocks.blocks = curBlocks.concat(newBlocks);
          }
          Blockly.serialization.workspaces.load(incoming, demoWorkspace);
        } else {
          // Legacy XML — use browser DOMParser (Blockly.Xml.textToDom removed in v12)
          var doc = new DOMParser().parseFromString(e.target.result, 'text/xml');
          Blockly.Xml.domToWorkspace(doc.documentElement, demoWorkspace);
        }
      } catch(err) {
        document.getElementById('errorbanner').style.display = 'block';
        document.getElementById('errorbanner').textContent =
          'Fehler beim Laden: ' + file.name + ' — ' + err.message;
        console.error(err);
      }
    };
    reader.readAsText(file);
  });
}

</script>


<!-- Toolbox -->
<xml xmlns="https://developers.google.com/blockly/xml" id="toolbox" style="display:none">
  <category name="JSMN Drone" colour="345">
    <block type="funcbegin"></block>
    <block type="funcend"></block>
    <block type="exports"></block>
