# JSMN IDE — nginx HTTPS config
# Requires nginx + a self-signed cert (run setup-ssl.sh first).
#
# Install:
#   sudo cp nginx/jsmn-ide.conf /etc/nginx/sites-available/jsmn-ide
#   sudo ln -s /etc/nginx/sites-available/jsmn-ide /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust JSMN_IDE_PATH and cert paths to match your installation.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;   # match any hostname / raw IP

    # --- SSL ---
    # Replace with absolute paths to your generated cert files.
    ssl_certificate     /home/mint/jsmcide/ssl/server.crt;
    ssl_certificate_key /home/mint/jsmcide/ssl/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- Static files ---
    root  /home/mint/jsmcide/openb3;
    index index.html index.php;

    location / {
        try_files $uri $uri/ =404;
    }

    # Optional: PHP support (requires php-fpm)
    # location ~ \.php$ {
    #     include        snippets/fastcgi-php.conf;
    #     fastcgi_pass   unix:/run/php/php-fpm.sock;
    # }
}

# Redirect plain HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}
